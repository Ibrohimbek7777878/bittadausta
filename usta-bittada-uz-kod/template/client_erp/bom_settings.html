<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOM Narx standarti — MebelCity</title>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
  body { background: var(--bg, #f4f5f7); margin: 0; font-family: 'Inter', sans-serif; }
  .bsp-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--card, #fff); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .bsp-top a { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
    color: var(--accent); }
  .bsp-top h1 { font-size: 15px; margin: 0; font-weight: 800; flex: 1; }
  .bsp-badge { font-size: 10.5px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#7c3aed,#4f46e5);
    padding: 3px 9px; border-radius: 999px; }
</style>
</head>
<body>
<div class="bsp-top">
  <a href="/mini/admin/"><i class="fas fa-arrow-left"></i> Admin panel</a>
  <h1><i class="fas fa-drafting-compass" style="color:var(--accent);margin-right:6px"></i> BOM Narx standarti</h1>
  <span class="bsp-badge">⚡ Global standart</span>
</div>

<div id="app"></div>

<script src="/static/client_erp/js/components/toast.js?v=12"></script>
<script src="/static/client_erp/js/pages/bom-settings.js?v=8"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.BomSettings && BomSettings.render) BomSettings.render();
  });
</script>
</body>
