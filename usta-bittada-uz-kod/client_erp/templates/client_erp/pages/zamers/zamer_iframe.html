{% extends 'client_erp/base.html' %}
{% load static %}

{% block title %}Zamer{% endblock %}

{% block extra_css %}
<style>
    .zamer-iframe-wrap {
        width: 100%;
        height: calc(100vh - 70px);
        border: none;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--surface2);
    }
    .zamer-iframe-wrap iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h4><i class="fas fa-ruler-combined"></i> Zamer</h4>
    <p class="text-muted" style="font-size:.85rem;margin:0">Xonalar o'lchami va 3D ko'rinish</p>
</div>

<div class="zamer-iframe-wrap">
    <iframe src="{{ iframe_url }}" allow="camera;fullscreen" allowfullscreen></iframe>
</div>
{% endblock %}
